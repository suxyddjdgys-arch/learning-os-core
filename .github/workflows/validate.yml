name: Validate Learning OS Core

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Core plane snapshot (validate_core)
        run: python scripts/validate_learning_os.py . --core
      - name: Run deterministic Core tests (synthetic fixtures, ownership/privacy negative tests)
        run: python -m unittest discover -s tests -v
